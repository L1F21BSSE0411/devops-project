name: wf-production-deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  production-build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        run: npm install

      - name: Build Website with Parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"

      - name: Debug Build Directory
        run: ls -la ./dist || echo "ERROR: dist/ folder is missing"

      - name: Verify index.html Exists
        run: cat ./dist/index.html || echo "ERROR: index.html is missing"

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "production-artifact"

  production-deploy-job:
    needs: production-build-job
    environment: production-env
    runs-on: ubuntu-latest
    steps:
      - name: Require Manual Approval Before Deployment
        run: echo "Waiting for manual approval before deployment."

      - name: Deploy Artifacts to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "production-artifact"
          token: ${{ secrets.GITHUB_TOKEN }}
